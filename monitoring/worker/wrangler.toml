name = "homelab-monitor"
main = "src/index.js"
compatibility_date = "2026-09-01"

[triggers]
crons = ["*/5 * * * *"]

[observability]
enabled = true

[[kv_namespaces]]
binding = "STATE"
# Replace with the real id after running:
#   wrangler kv namespace create STATE
id = "e51232ef049d46d6ac163b821eca286a"

[vars]
# Practitioner: swap for the public hostname once Step 1 (tunnel exposure) is done.
STATUS_URL = "https://status.nate.green/status.json"
NTFY_URL = "https://ntfy.nate.green"
NTFY_TOPIC = "homelab"
# NTFY_TOKEN is a secret: wrangler secret put NTFY_TOKEN (a write-only token on the self-hosted ntfy)
