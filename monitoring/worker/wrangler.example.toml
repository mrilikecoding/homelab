name = "homelab-monitor"
main = "src/index.js"
compatibility_date = "2026-09-01"

[triggers]
crons = ["*/5 * * * *"]

[observability]
enabled = true

[[kv_namespaces]]
binding = "STATE"
# Replace with the real id after running:
#   wrangler kv namespace create STATE
id = "<kv-namespace-id>"

[vars]
# The public hostname of the status page (tunnel exposure) and of your ntfy.
STATUS_URL = "https://status.example.com/status.json"
NTFY_URL = "https://ntfy.example.com"
NTFY_TOPIC = "your-ntfy-topic"
# NTFY_TOKEN is a secret: wrangler secret put NTFY_TOKEN (a write-only token on the self-hosted ntfy)
